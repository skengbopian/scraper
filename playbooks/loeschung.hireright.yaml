# Art. 15 access + Art. 17 erasure of unlawfully-collected screening data for HireRight (background-
# screening firm). docs/10 §7.7 target #4. A CASE-BY-CASE lever: the letter asks what is held, then
# challenges the categories German employment law does not permit (Art. 10/§§51,53 BZRG criminal records,
# Art. 9 health, private social-media, Schufa-in-hiring). onDeadlineExpiry: NONE (no verified German
# provable-send path); a refusal escalates. CONTROLLER: often the EMPLOYER; screening firm may be a
# processor (Art. 28) — confirm per case. active:false pending counsel (OQ-17).
slug: loeschung.hireright
kind: RIGHTS_REQUEST
controller: hireright
requestType: ERASURE_ART17
version: 1
active: false
legalBasis: "DSGVO Art. 17 Abs. 1 lit. d i.V.m. Art. 15"
channel:
  primary: email
  fallback: web_form
recipient:
  email: "dataprotection@hireright.com"                         # TODO(counsel): verify
  webForm: "https://www.hireright.com/legal/privacy-policy"     # TODO(counsel): verify DSR portal
template: art15-17-screening.de
identityProof:
  required: false
  accepts: [none]
subjectFields:
  - legalName
  - addresses
deadlineDays: 30
validation:
  # "erforderlich" / "berechtigtes Interesse" are the vocabulary of a LAWFUL Art. 15 answer (which must
  # state purpose + legal basis), NOT a refusal — so they are dropped from refusedIf. Compliance leans on
  # structured.erased; refusal on refusal-specific phrasing (incl. an identity-verification refusal).
  compliedIf:
    anyOf:
      - structured.erased: true
      - responseContains: ["vollständig gelöscht", "Daten gelöscht", "wurde entfernt"]
  refusedIf:
    anyOf:
      - responseContains: ["Löschung lehnen wir ab", "Aufbewahrungspflicht", "keine Löschung", "Identität nicht"]
      - structured.refusedDeletion: true
  humanReviewIfConfidenceBelow: 0.75
escalation:
  onDeadlineExpiry: NONE
  onRefusal: DRAFT_ART77
notes: >
  Lead with the access request to establish what categories are held, then challenge the unlawful ones
  (Art. 10/§§51,53 BZRG, Art. 9, private social-media, Schufa-in-hiring). Erasure rests on Art. 17(1)(d).
