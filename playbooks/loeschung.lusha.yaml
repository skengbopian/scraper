# Art. 17 erasure + Art. 21(1) objection to Lusha Systems, Inc. (US enrichment broker).
# docs/10 §7.7 target #1. Self-serve form (https://www.lusha.com/privacy-center/request-removal/) is the
# cheapest rung; this is the LEGAL FALLBACK. Note: Lusha's Art. 27 EU representative is DP-Dock GmbH,
# Hamburg — a German contact point (though not a main establishment; venue stays the user's Land DPA,
# OQ-20). active:false pending counsel (OQ-17).
slug: loeschung.lusha
kind: RIGHTS_REQUEST
controller: lusha
requestType: ERASURE_ART17
version: 3
active: false
legalBasis: "DSGVO Art. 17 Abs. 1 i.V.m. Art. 21 Abs. 1"
channel:
  primary: email
  fallback: web_form
recipient:
  email: "privacy@lusha.com"                                       # TODO(counsel): verify
  webForm: "https://www.lusha.com/privacy-center/request-removal/" # TODO(counsel): verify
template: art17-datenhaendler.de
identityProof:
  required: false
  accepts: [none]
subjectFields:
  - legalName
deadlineDays: 30
validation:
  compliedIf:
    anyOf:
      - responseContains: ["gelöscht", "Löschung", "entfernt", "deleted", "removed from"]
      - structured.erased: true
  # v2 (audit P6): negated replies must trip the contradiction path, never validate as COMPLIED —
  # "nicht gelöscht" contains the compliedIf needle "gelöscht", so without these the erasure
  # REJECTION letter satisfied compliedIf alone and auto-closed the case as success.
  refusedIf:
    anyOf:
      - responseContains: ["berechtigtes Interesse", "lehnen wir ab", "legitimate interest", "we decline", "nicht gelöscht", "keine Löschung", "nicht entfernt", "erfolgt nicht", "not deleted", "will not remove", "cannot delete"]
  humanReviewIfConfidenceBelow: 0.75
escalation:
  onDeadlineExpiry: NONE
  onRefusal: DRAFT_ART77
# v3 (decision D4): onRefusal drafts an Art. 77 complaint, so this playbook can reach
# ESCALATION_DRAFTED, and it named no venue. Lusha Systems, Inc. is a US controller; its Art. 27
# representative DP-Dock GmbH sits in Hamburg, which makes HMBBFDI a tempting seatDpa and a WRONG
# one — an Art. 27 representative is a contact point, not a main establishment, so it creates no
# lead SA and moves no venue. The competent authority is the one for the USER's habitual residence
# (Art. 77(1); docs/07, and this file's own header note). `venue` is the only way to say that.
venue: USER_RESIDENCE                 # TODO(counsel): OQ-20 — confirm the Hamburg Art. 27 rep does
                                      # not engage the one-stop-shop
notes: >
  Art. 27 rep DP-Dock GmbH (Hamburg) may be addressed in parallel. Reappears after removal — demand the
  suppression list and re-check.
