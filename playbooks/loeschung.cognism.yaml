# Art. 17 erasure + Art. 21(1) objection to Cognism Limited (UK enrichment broker; owns the CNIL-fined
# Kaspr). docs/10 §7.7 target #1. Self-serve form (https://cognism.privacy.saymine.io/cognism) is the
# cheapest rung; this is the LEGAL FALLBACK. VENUE: the user always LODGES at their own habitual-
# residence Land DPA (Art. 77(1)); the one-stop-shop only determines which SA becomes LEAD for
# cross-border coordination — it never moves the filing venue. Cognism is a UK controller; its EU
# subsidiaries (Cognism GmbH/DE, KASPR SAS/FR) do not automatically make an EU entity the "main
# establishment", so counsel (OQ-20) must confirm the controller and whether OSS engages at all.
# active:false pending counsel (OQ-17).
slug: loeschung.cognism
kind: RIGHTS_REQUEST
controller: cognism
requestType: ERASURE_ART17
version: 3
active: false
legalBasis: "DSGVO Art. 17 Abs. 1 i.V.m. Art. 21 Abs. 1"
channel:
  primary: email
  fallback: web_form
recipient:
  email: "privacy@cognism.com"                            # TODO(counsel): verify
  webForm: "https://cognism.privacy.saymine.io/cognism"   # TODO(counsel): verify
template: art17-datenhaendler.de
identityProof:
  required: false
  accepts: [none]
subjectFields:
  - legalName
deadlineDays: 30
validation:
  compliedIf:
    anyOf:
      - responseContains: ["gelöscht", "Löschung", "entfernt", "deleted", "removed from"]
      - structured.erased: true
  # v2 (audit P6): negated replies must trip the contradiction path, never validate as COMPLIED —
  # "nicht gelöscht" contains the compliedIf needle "gelöscht", so without these the erasure
  # REJECTION letter satisfied compliedIf alone and auto-closed the case as success.
  refusedIf:
    anyOf:
      - responseContains: ["berechtigtes Interesse", "lehnen wir ab", "legitimate interest", "we decline", "nicht gelöscht", "keine Löschung", "nicht entfernt", "erfolgt nicht", "not deleted", "will not remove", "cannot delete"]
  humanReviewIfConfidenceBelow: 0.75
escalation:
  onDeadlineExpiry: NONE
  onRefusal: DRAFT_ART77
# v3 (decision D4): onRefusal drafts an Art. 77 complaint, so this playbook can reach
# ESCALATION_DRAFTED — with, until now, no venue anywhere in the document. This file's header already
# argued the venue at length (the user always LODGES at their own habitual-residence Land DPA; the
# one-stop-shop only picks a LEAD SA for cross-border coordination and never moves the filing venue),
# but that argument lived in a comment no gate could read. `venue: USER_RESIDENCE` states it in a
# field, so the schema can now insist that some venue is stated.
venue: USER_RESIDENCE                 # TODO(counsel): OQ-20 — Cognism Limited is UK; whether its EU
                                      # subsidiaries (Cognism GmbH/DE, KASPR SAS/FR) make an EU entity
                                      # the main establishment is open, but OSS would pick a lead SA,
                                      # not a filing venue
notes: >
  KASPR (Cognism-owned) is the CNIL €240k precedent — strong Art. 17(1)(d) material for this group.
  An Art. 27 representative is not a "main establishment" and creates no lead SA; the filing venue is
  always the user's own Land DPA (Art. 77(1)). Confirm the controller entity and OSS with counsel (OQ-20).
