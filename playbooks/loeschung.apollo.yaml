# Art. 17 erasure + Art. 21(1) objection to Apollo.io (ZenLeads, Inc.; US enrichment broker).
# docs/10 §7.7 target #1. Self-serve form (https://www.apollo.io/privacy-policy/remove) is the cheapest
# rung; this is the LEGAL FALLBACK. See loeschung.zoominfo for the clock/venue rationale. active:false
# pending counsel (OQ-17).
slug: loeschung.apollo
kind: RIGHTS_REQUEST
controller: apollo
requestType: ERASURE_ART17
version: 2
active: false
legalBasis: "DSGVO Art. 17 Abs. 1 i.V.m. Art. 21 Abs. 1"
channel:
  primary: email
  fallback: web_form
recipient:
  email: "privacy@apollo.io"                                # TODO(counsel): verify
  webForm: "https://www.apollo.io/privacy-policy/remove"    # TODO(counsel): verify
template: art17-datenhaendler.de
identityProof:
  required: false
  accepts: [none]
subjectFields:
  - legalName
deadlineDays: 30
validation:
  compliedIf:
    anyOf:
      - responseContains: ["gelöscht", "Löschung", "entfernt", "deleted", "removed from"]
      - structured.erased: true
  # v2 (audit P6): negated replies must trip the contradiction path, never validate as COMPLIED —
  # "nicht gelöscht" contains the compliedIf needle "gelöscht", so without these the erasure
  # REJECTION letter satisfied compliedIf alone and auto-closed the case as success.
  refusedIf:
    anyOf:
      - responseContains: ["berechtigtes Interesse", "lehnen wir ab", "legitimate interest", "we decline", "nicht gelöscht", "keine Löschung", "nicht entfernt", "erfolgt nicht", "not deleted", "will not remove", "cannot delete"]
  humanReviewIfConfidenceBelow: 0.75
escalation:
  onDeadlineExpiry: NONE
  onRefusal: DRAFT_ART77
notes: >
  Crowdsource re-ingestion is Apollo's main reappearance vector — the letter must demand addition to the
  suppression list for all known emails/phones, not only deletion of the current record.
