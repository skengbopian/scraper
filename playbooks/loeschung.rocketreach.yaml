# Art. 17 erasure + Art. 21(1) objection to RocketReach LLC (US enrichment broker). docs/10 §7.7
# target #1. Self-serve form (https://rocketreach.co/remove-profile) is the cheapest rung; this is the
# LEGAL FALLBACK. See loeschung.zoominfo for the clock/venue rationale. active:false pending counsel
# (OQ-17).
slug: loeschung.rocketreach
kind: RIGHTS_REQUEST
controller: rocketreach
requestType: ERASURE_ART17
version: 3
active: false
legalBasis: "DSGVO Art. 17 Abs. 1 i.V.m. Art. 21 Abs. 1"
channel:
  primary: email
  fallback: web_form
recipient:
  email: "privacy@rocketreach.co"                   # TODO(counsel): verify
  webForm: "https://rocketreach.co/remove-profile"  # TODO(counsel): verify
template: art17-datenhaendler.de
identityProof:
  required: false
  accepts: [none]
subjectFields:
  - legalName
deadlineDays: 30
validation:
  compliedIf:
    anyOf:
      - responseContains: ["gelöscht", "Löschung", "entfernt", "deleted", "removed from"]
      - structured.erased: true
  # v2 (audit P6): negated replies must trip the contradiction path, never validate as COMPLIED —
  # "nicht gelöscht" contains the compliedIf needle "gelöscht", so without these the erasure
  # REJECTION letter satisfied compliedIf alone and auto-closed the case as success.
  refusedIf:
    anyOf:
      - responseContains: ["berechtigtes Interesse", "lehnen wir ab", "legitimate interest", "we decline", "nicht gelöscht", "keine Löschung", "nicht entfernt", "erfolgt nicht", "not deleted", "will not remove", "cannot delete"]
  humanReviewIfConfidenceBelow: 0.75
escalation:
  onDeadlineExpiry: NONE
  onRefusal: DRAFT_ART77
# v3 (decision D4): onRefusal drafts an Art. 77 complaint, so this playbook can reach
# ESCALATION_DRAFTED with no venue recorded. RocketReach LLC is a US controller with no German
# establishment, so there is no seat to name and the competent authority follows the USER's habitual
# residence (Art. 77(1)). See loeschung.zoominfo for the full rationale.
venue: USER_RESIDENCE                 # TODO(counsel): OQ-20 — confirm no EU main establishment
                                      # engages the one-stop-shop (Art. 27 rep VeraSafe Ireland is a
                                      # contact point, not an establishment)
notes: >
  Reappears after removal (public-web re-scraping) — demand the suppression list and re-check in ~4 weeks.
