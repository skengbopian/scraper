# Art. 15(1)(g) provenance request to CRIF GmbH (ex-Bürgel) — the third bureau, and the one this repo
# had no playbook for at all. CLAUDE.md's pivot focus names infoscore and CRIF as the primary targets
# and pools their Art. 77 escalations at one authority (LfDI Baden-Württemberg), which is worth having:
# a second file at the same venue is a stronger complaint than two isolated ones.
#
# Forces the controller to name its sources per data category. A named broker starts the Art. 17(1)(d)
# chain (loeschung-herkunft.crif); an incomplete answer is itself a violation (BayLDA precedent,
# ADR-014), which is why onIncompleteSourceList is set.
#
# Lineage: the pre-audit line's provenance.crif v2 (ADR-030 wave 4). Version restarts at 1 here.
#
# TODO(counsel): verify the Art. 15(1)(g) intake route and the Datenschutz address before activation.
slug: provenance.crif
kind: RIGHTS_REQUEST
controller: crif
requestType: ACCESS_ART15_SOURCE
version: 1
active: false
legalBasis: "DSGVO Art. 15 Abs. 1 lit. g"
templateFlags:
  isSchufa: false
channel:
  primary: postal
  fallback: email
  registered:
    primary: true                     # escalation-bound: the clock must start on a provable send
    fallback: false                   # email cannot be registered, and never starts the clock
recipient:
  # Street address so an Einwurf-Einschreiben is deliverable. Source: the repo's datenanfragen
  # snapshot (CC0, quality "verified"). NOTE the venue tension recorded as OQ-25: this address is in
  # Bavaria (BayLDA) while docs/07 and CLAUDE.md both put CRIF's Art. 77 venue at LfDI BW.
  postal: "CRIF GmbH, Datenschutzbeauftragter, Leopoldstraße 244, 80807 München"   # TODO(counsel): verify
  email: "datenschutz.de@crif.com"                                                 # TODO(counsel): verify
template: art15g-herkunft.de
identityProof:
  required: true                      # the bureau matches the request against the file it holds
  accepts: [redacted_id]
subjectFields: [legalName, dateOfBirth, addresses]
deadlineDays: 30
provenance:
  extractPerCategory: true
  brokerWatchlist: [az-direct, acxiom, deutsche-post-direkt, schober, capaneo, regis24, postadress]
  flagIf:
    incompleteSourceList: true
    contradictsArt14: false           # CRIF's own Art. 14 notice has not been analysed here — unlike
                                      # infoscore, there is no admitted source to contradict yet
validation:
  compliedIf:
    anyOf:
      - structured.sourcesNamedPerCategory: true
  refusedIf:
    anyOf:
      - responseContains: ["keine Angaben zur Herkunft", "Geschäftsgeheimnis", "nicht möglich"]
  humanReviewIfConfidenceBelow: 0.8
escalation:
  onDeadlineExpiry: DRAFT_ART77
  onRefusal: DRAFT_ART77
  onIncompleteSourceList: DRAFT_ART77  # an incomplete Art. 15 answer is itself a violation (ADR-014)
seatDpa: LFDI_BW                       # LfDI Baden-Württemberg — same venue as infoscore (docs/07, CLAUDE.md)
notes: >
  Where the answer names a watchlisted broker, the chain continues at loeschung-herkunft.crif
  (Art. 17(1)(d) at the bureau) and at the broker itself. All follow-ups are PROPOSALS requiring human
  confirmation — parser output may not spawn an outbound legal request (CLAUDE.md §2). Do NOT auto-send
  the Art. 77 draft.
